apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-app
  namespace: t5
  labels:
    app.kubernetes.io/name: go-app
    app.kubernetes.io/managed-by: deepagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
